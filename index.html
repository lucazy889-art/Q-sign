<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My E-Sign</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  text-align: center;
  padding: 20px;
}
.container {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 15px;
}
canvas {
  width: 100%;
  height: 220px;
  border: 2px solid #333;
  border-radius: 10px;
  background: white;
  touch-action: none;
}
button {
  padding: 12px 18px;
  margin: 8px 4px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background: #2563eb;
  color: white;
  font-size: 15px;
}
.clear { background: #dc2626; }
</style>
</head>
<body>

<div class="container">
  <h1>✍️ My E-Sign</h1>
  <p>Draw your signature below</p>

  <canvas id="signature"></canvas>

  <br>
  <button class="clear" onclick="clearSign()">
    Clear
  </button>

  <button onclick="saveSign()">
    Download PNG
  </button>

  <p id="message"></p>
</div>

<script>
const canvas = document.getElementById("signature");
const ctx = canvas.getContext("2d");

let drawing = false;
let hasSignature = false;

function setupCanvas() {
  const rect = canvas.getBoundingClientRect();
  const ratio = window.devicePixelRatio || 1;

  canvas.width = rect.width * ratio;
  canvas.height = rect.height * ratio;

  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#111827";
}

setupCanvas();

function position(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: e.clientX - rect.left,
    y: e.clientY - rect.top
  };
}

canvas.addEventListener("pointerdown", e => {
  drawing = true;
  hasSignature = true;
  canvas.setPointerCapture(e.pointerId);

  const p = position(e);
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
});

canvas.addEventListener("pointermove", e => {
  if (!drawing) return;

  const p = position(e);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
});

function stopDrawing() {
  drawing = false;
}

canvas.addEventListener("pointerup", stopDrawing);
canvas.addEventListener("pointercancel", stopDrawing);

function clearSign() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  hasSignature = false;
  document.getElementById("message").textContent =
    "Signature cleared";
}

function saveSign() {
  if (!hasSignature) {
    document.getElementById("message").textContent =
      "Please draw a signature first!";
    return;
  }

  const link = document.createElement("a");
  link.download = "my-signature.png";
  link.href = canvas.toDataURL("image/png");
  link.click();

  document.getElementById("message").textContent =
    "Signature downloaded!";
}
</script>

</body>
</html>
